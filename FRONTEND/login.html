<!DOCTYPE html>
<html>
<head>
    <meta charset="{{ html_charset }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
    <div class="auth-tabs">
        <button type="button" class="auth-tab-button is-active" data-target-panel-id="login-panel">Login</button>
        <button type="button" class="auth-tab-button" data-target-panel-id="register-panel">Register</button>
    </div>
    <div id="auth-error" class="auth-error-message{% if error_message %} is-visible{% endif %}" role="alert" aria-live="polite"{% if not error_message %} hidden{% endif %}>{{ error_message or "" }}</div>

    <div id="login-panel" class="auth-form-panel is-active">
        <form method="post" action="/">
            <input type="hidden" name="auth_action" value="login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
            <label class="visually-hidden" for="login-username">Username</label>
            <input id="login-username" name="username" placeholder="Username" autocomplete="username" maxlength="{{ auth_username_max_length }}" required>
            <label class="visually-hidden" for="login-password">Password</label>
            <input id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" minlength="{{ auth_password_min_length }}" maxlength="{{ auth_password_max_length }}" required>
            <button>Sign In</button>
        </form>
    </div>

    <div id="register-panel" class="auth-form-panel">
        <form method="post" action="/">
            <input type="hidden" name="auth_action" value="register">
            <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
            <label class="visually-hidden" for="register-username">Username</label>
            <input id="register-username" name="username" placeholder="Username" autocomplete="username" maxlength="{{ auth_username_max_length }}" required>
            <label class="visually-hidden" for="register-password">Password</label>
            <input id="register-password" name="password" type="password" placeholder="Password" autocomplete="new-password" minlength="{{ auth_password_min_length }}" maxlength="{{ auth_password_max_length }}" required>
            <button>Sign Up</button>
        </form>
    </div>

    <script src="/assets/auth.js"></script>
</body>
</html>
