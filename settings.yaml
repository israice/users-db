app:
  # Display name of the FastAPI application (used in app metadata).
  name: "Users DB"
  # Application version shown in FastAPI metadata/docs.
  version: "1.0.0"

server:
  # Interface/address where Uvicorn binds.
  host: "127.0.0.1"
  # TCP port where the HTTP server listens.
  port: 5000
  # Enable auto-reload on code changes (development mode).
  reload: false

database:
  # Path to the SQLite database file.
  path: "DATA/users.db"

session:
  # Name of the signed session cookie.
  cookie_name: "users_db_session"
  # SameSite policy for session cookie: lax | strict | none.
  same_site: "lax"
  # Send session cookie only over HTTPS when true.
  https_only: false

security:
  # Entropy size parameter for CSRF token generation.
  csrf_token_bytes: 32

python:
  # Disable writing .pyc files and __pycache__ directories.
  disable_bytecode_cache: true
